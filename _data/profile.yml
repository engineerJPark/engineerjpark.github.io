# Paragraphs shown at the top of the homepage. Markdown is allowed.
bio:
  - >-
    I am a Ph.D. candidate at [KAIST AI](https://gsai.kaist.ac.kr/), advised by
    [Prof. Hyunjung Shim](https://scholar.google.com/citations?user=KB5XZGIAAAAJ&hl=en).
    I received my B.S. in Mechanical Engineering & Artificial Intelligence from
    [Korea University](https://www.korea.edu/sites/en/index.do).
  - >-
    I am a research intern at **Qualcomm AI Research**, investigating reasoning
    faithfulness in driving vision-language-action (VLA) models.
  - >-
    My research focuses on Physical AI & LLMs. 
    I have been working on autonomous driving, vision-language models (VLMs), and LiDAR perception. 
    I am interested in building AI systems that can understand and interact with the physical world.
    Recently, I'm interested in unifying various tasks and embodiments on a single VLA/WAM model.

