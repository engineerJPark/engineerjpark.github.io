#   year     : year
#   note     : highlight such as "Oral" (optional)
#   type     : conference | journal | workshop | preprint | report
#   tags     : names from pub_filters in profile.yml
#   thumb    : image path, e.g. /images/paper_thumb/foo.webp (optional; a placeholder is drawn if empty)
#              figures keep their own aspect ratio (no cropping)
#   links    : any of pdf, arxiv, code, project, poster, video (all optional)
#   cv       : false to show on the homepage only (optional)
# ---------------------------------------------------------------

